name: OCM Install

on:
  pull_request:
    paths:
      - Formula/ocm.rb
      - .github/scripts/**
      - .github/workflows/ocm-smoke.yml
      - tests/smoke_ocm.sh
      - tests/setup_intel_homebrew.sh
  push:
    branches:
      - main
    paths:
      - Formula/ocm.rb
      - .github/scripts/**
      - .github/workflows/ocm-smoke.yml
      - tests/smoke_ocm.sh
      - tests/setup_intel_homebrew.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: OCM install (${{ matrix.runner }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.runner == 'xcode-27' && matrix.arch == 'x86_64' && '/usr/bin/arch -x86_64 /bin/bash --noprofile --norc -e -o pipefail {0}' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            arch: arm64
          - runner: xcode-27
            arch: x86_64
          - runner: ubuntu-24.04
            arch: x86_64
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Intel Homebrew under Rosetta
        if: matrix.runner == 'xcode-27' && matrix.arch == 'x86_64'
        shell: bash
        run: bash tests/setup_intel_homebrew.sh

      - name: Install and test the checked-out OCM formula
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash tests/smoke_ocm.sh
